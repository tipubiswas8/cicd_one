name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest code and refresh app
        run: |
          cd /home/sohel/tipu/projects/cicd_one
          git pull origin main
          
      - name: Rebuild and restart containers
        run: |
          cd /home/sohel/tipu/projects/cicd_two
          docker compose down
          docker compose up -d --build
